CONFIG_SERIAL=y
CONFIG_BUILD_OUTPUT_META=y

#######################
# Base Configuration 
#######################

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=n
CONFIG_UART_ASYNC_API=y
CONFIG_EARLY_CONSOLE=y

CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETLINE=n
CONFIG_CONSOLE_GETCHAR_BUFSIZE=64
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=2048
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=256
CONFIG_CONSOLE_HANDLER=y
CONFIG_CONSOLE_INIT_PRIORITY=60


CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_BOOT_BANNER=n

CONFIG_HWINFO=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UUID=y

CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y
CONFIG_LEGACY_GENERATED_INCLUDE_PATH=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_COMPILER_SAVE_TEMPS=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y
CONFIG_BUILD_OUTPUT_META=y
CONFIG_OUTPUT_STAT=y
CONFIG_OUTPUT_SYMBOLS=y
CONFIG_CLEANUP_INTERMEDIATE_FILES=n
CONFIG_BUILD_OUTPUT_STRIP_PATHS=y
CONFIG_CHECK_INIT_PRIORITIES=y
CONFIG_DEBUG=y
#CONFIG_RETAINED_RAM=y

#CONFIG_INSTRUMENTATION=y
#CONFIG_INSTRUMENTATION_MODE_CALLGRAPH=y    # For tracing
#CONFIG_INSTRUMENTATION_MODE_STATISTICAL=y  # For profiling


# Kernel options
CONFIG_MAIN_STACK_SIZE=2048

#######################
# CPP Configuration 
#######################
CONFIG_CPP=y
#CONFIG_NEWLIB_LIBC=y      # strongly recommended
CONFIG_GLIBCXX_LIBCPP=y
#CONFIG_CPP_MAIN=y
CONFIG_STD_CPP20=y

#######################
# Logging Configuration 
#######################
CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_GPIO_LOG_LEVEL_DBG=y
CONFIG_REQUIRES_FULL_LIBCPP=y

#######################
# Shell Configuration 
#######################
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=n 
CONFIG_SHELL_CMDS_SELECT=y
CONFIG_SHELL_START_OBSCURED=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_THREAD_PRIORITY=2

# allow separate shell + console UART devices
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n


CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_BOOT_BANNER=n
CONFIG_THREAD_NAME=y
CONFIG_DEVICE_SHELL=y
